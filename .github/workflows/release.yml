# On a version tag (v0.2.0 ...): build the one-file `kalan` executable on Windows, macOS (arm64) and
# Linux, smoke-test each build, and attach the three files plus SHA256SUMS.txt to a GitHub Release.
# Asset names carry no version, so .../releases/latest/download/<name> always points at the newest build:
#   kalan-back-windows-x64.exe  kalan-back-macos-arm64  kalan-back-linux-x64  SHA256SUMS.txt
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            binary: kalan.exe
            asset: kalan-back-windows-x64.exe
          - os: macos-latest
            binary: kalan
            asset: kalan-back-macos-arm64
          - os: ubuntu-latest
            binary: kalan
            asset: kalan-back-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[build]"
      - name: Tag matches the package version
        shell: bash
        run: |
          version=$(python -c "import kalan; print(kalan.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Build
        run: pyinstaller packaging/kalan.spec --clean --noconfirm
      - name: Smoke test
        run: python packaging/smoke.py dist/${{ matrix.binary }}
      - name: Rename
        shell: bash
        run: |
          mkdir out
          cp "dist/${{ matrix.binary }}" "out/${{ matrix.asset }}"
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: |
          chmod +x kalan-back-macos-arm64 kalan-back-linux-x64
          sha256sum kalan-back-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY"
          --title "kalan $GITHUB_REF_NAME" --generate-notes --verify-tag
