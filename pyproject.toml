[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalan"
version = "0.1.0"
description = "Local, installment-first credit card statement tracker"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "kalan contributors" }]
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "platformdirs>=4",
    "python-multipart>=0.0.9",
    "keyring>=24",
    "pyyaml>=6",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pymupdf-fonts>=1.0", "httpx>=0.27", "httpx2>=2"]

[project.scripts]
kalan = "kalan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kalan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
