# Built-in merchant clean-up and category rules (Turkish merchants first). Edit freely and send a pull request.
#
# merchant:   how a printed description becomes a merchant name (kalan.categories.normalize_merchant).
#   processors: payment-processor prefixes printed before the real shop, as "IYZICO*SHOP" or "PAYTR *SHOP".
#   tails:      words dropped from the end: country codes, cities, districts (several in a row are dropped).
# rules:      category -> phrases. A phrase matches the merchant name as whole words, after fold(): lower case,
#             no diacritics, Turkish I variants unified ("sok market" matches "ŞOK MARKET"). When several phrases
#             match, the longest wins ("getir yemek" beats "getir"). Categories must be one of kalan's list.
# kinds:      transaction kind -> category, used before the phrases (fees, interest, taxes, cash advances).
# User rules (POST /category-rules) come before all of this.

version: 1

